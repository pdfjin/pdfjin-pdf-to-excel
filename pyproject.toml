[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfjin-pdf-to-excel"
version = "0.1.0"
authors = [
  { name="PDFJin Team", email="support@pdfjin.com" },
]
description = "Extract tabular data from PDF into Microsoft Excel (XLSX) by PDFJin"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["pdf", "pdfjin", "cli", "pdf-tools", "document-processing", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Printing",
    "Topic :: Utilities",
]
dependencies = ["pdfplumber>=0.10.0", "pandas>=2.0.0", "openpyxl>=3.1.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
"Homepage" = "https://pdfjin.com"
"Online Tool" = "https://pdfjin.com/pages/pdf-to-excel.html"
"Source" = "https://github.com/pdfjin/pdfjin-pdf-to-excel"
"Bug Tracker" = "https://github.com/pdfjin/pdfjin-pdf-to-excel/issues"

[project.scripts]
pdfjin-pdf-to-excel = "pdfjin_pdf_to_excel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdfjin_pdf_to_excel*"]
